  </g>
  <g id="picture-slot-5" data-pptx-placeholder="picture" data-pptx-placeholder-idx="14" data-pptx-placeholder-bounds="866 365 205 300">
    <image id="picture-carrier-5" data-pptx-placeholder-carrier="true" href="../images/{{PHOTO_5}}" x="866" y="365" width="205" height="300" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <g id="picture-slot-6" data-pptx-placeholder="picture" data-pptx-placeholder-idx="15" data-pptx-placeholder-bounds="1085 365 205 300">
