  </g>
  <g id="panel-footnote">
    <text font-weight="300" x="97" y="646" font-family="Freesentation, Paperlogy, 'Malgun Gothic', sans-serif" font-size="8" fill="#4A5250">{{FOOTNOTE}}</text>
