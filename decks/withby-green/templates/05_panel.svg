  </g>
  <g id="panel-kpi-1">
    <text x="97" y="350" font-family="'Paperlogy ExtraBold', Paperlogy, 'Malgun Gothic', sans-serif" font-size="27" fill="#039944">{{KPI_VALUE_1}}</text>
    <text font-weight="500" x="97" y="376" font-family="Freesentation, Paperlogy, 'Malgun Gothic', sans-serif" font-size="16" fill="#4A5250">{{KPI_LABEL_1}}</text>
  </g>
  <g id="panel-kpi-2">
    <text x="97" y="434" font-family="'Paperlogy ExtraBold', Paperlogy, 'Malgun Gothic', sans-serif" font-size="27" fill="#039944">{{KPI_VALUE_2}}</text>
    <text font-weight="500" x="97" y="460" font-family="Freesentation, Paperlogy, 'Malgun Gothic', sans-serif" font-size="16" fill="#4A5250">{{KPI_LABEL_2}}</text>
  </g>
  <g id="panel-kpi-3">
    <text x="97" y="518" font-family="'Paperlogy ExtraBold', Paperlogy, 'Malgun Gothic', sans-serif" font-size="27" fill="#039944">{{KPI_VALUE_3}}</text>
    <text font-weight="500" x="97" y="544" font-family="Freesentation, Paperlogy, 'Malgun Gothic', sans-serif" font-size="16" fill="#4A5250">{{KPI_LABEL_3}}</text>
  </g>
  <g id="picture-slot-1" data-pptx-placeholder="picture" data-pptx-placeholder-idx="10" data-pptx-placeholder-bounds="640 240 542 400">
