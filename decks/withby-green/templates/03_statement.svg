<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="withby-master" data-pptx-master-name="Withby Green" data-pptx-layout="c-statement" data-pptx-layout-name="C — Statement">
  <rect id="master-bg" width="1280" height="720" fill="#FFFFFF" data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="layout-ground" width="1280" height="720" fill="#00443D" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="layout-statement-rule" x="704" y="196" width="64" height="3" fill="#C8FF64" data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="picture-slot-1" data-pptx-placeholder="picture" data-pptx-placeholder-idx="10" data-pptx-placeholder-bounds="0 0 640 720">
    <image id="picture-carrier-1" data-pptx-placeholder-carrier="true" href="../images/{{PHOTO}}" x="0" y="0" width="640" height="720" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <g id="page-number-slot" data-pptx-placeholder="slide-number" data-pptx-placeholder-idx="3" data-pptx-placeholder-bounds="1134 44 103 20">
    <text id="page-number-carrier" data-pptx-placeholder-carrier="true" font-weight="300" text-anchor="end" x="1237" y="56" font-family="Freesentation, Paperlogy, 'Malgun Gothic', sans-serif" font-size="12" fill="#FFFFFF">{{PAGE_NUM}}</text>
  </g>
  <g id="statement-label">
    <text font-weight="300" x="704" y="250" font-family="'Paperlogy SemiBold', Paperlogy, 'Malgun Gothic', sans-serif" font-size="17" fill="#C8FF64">{{LABEL}}</text>
  </g>
  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="704 290 512 140">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="704" y="340" font-family="'Paperlogy ExtraBold', Paperlogy, 'Malgun Gothic', sans-serif" font-size="59" fill="#C8FF64">{{STATEMENT_TITLE}}</text>
  </g>
  <g id="statement-body">
    <text font-weight="300" x="704" y="420" font-family="Freesentation, Paperlogy, 'Malgun Gothic', sans-serif" font-size="27" fill="#FFFFFF">{{STATEMENT_BODY}}</text>
  </g>
</svg>
